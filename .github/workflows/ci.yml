name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PESTER_VERSION: '5.7.1'

jobs:

  # Repository hygiene. Runs on Linux because none of these checks touch Windows:
  # Test-ForbiddenPath and Test-ReadmeClaim are deliberately platform-agnostic.
  repo-checks:
    name: Secrets and README claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tip

      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full history for secrets
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact --exit-code 1

      - name: Check for forbidden paths
        shell: pwsh
        run: ./tools/Test-ForbiddenPath.ps1

      - name: Check README claims resolve
        shell: pwsh
        run: ./tools/Test-ReadmeClaim.ps1

  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Analyze
        shell: pwsh
        run: |
          # Two files are excluded, both justified in PSScriptAnalyzerSettings.psd1:
          # a signed evidence file that cannot be edited without invalidating its
          # signature, and a verbatim lab transcript. No rules are disabled and no
          # findings are suppressed -- a suppression that exists only to make CI
          # green is a lie told to every future reader.
          # -Force is required: without it Get-ChildItem skips dot-directories,
          # so .github/scripts/*.ps1 would never be analysed and the lint job
          # would report clean while ignoring the CI scripts themselves.
          $exclude = @('myscript.ps1', 'lab04-transcript.ps1')
          $files = Get-ChildItem -Path . -Recurse -Force -Include *.ps1, *.psm1, *.psd1 |
              Where-Object { $_.Name -notin $exclude -and $_.FullName -notmatch '[\\/]\.git[\\/]' }

          $results = foreach ($f in $files) {
              Invoke-ScriptAnalyzer -Path $f.FullName -Settings ./PSScriptAnalyzerSettings.psd1
          }

          if ($results) {
              $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize |
                  Out-String -Width 250 | Write-Output
              throw "PSScriptAnalyzer reported $(@($results).Count) finding(s)."
          }
          Write-Output "PSScriptAnalyzer clean across $($files.Count) files."

  test:
    name: Pester (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The module targets 5.1, so 5.1 is the contract. 7 is tested because
          # code written for 5.1 should run there and that claim needs proving.
          #
          # The interpreter is selected inside the step rather than via `shell:`.
          # `shell:` accepts no expressions at all -- `shell: ${{ matrix.shell }}`
          # is rejected before any job starts, which surfaces as a run that fails
          # in 0s with no logs and no jobs.
          - name: Windows PowerShell 5.1
            exe: powershell
            suffix: ps51
          - name: PowerShell 7
            exe: pwsh
            suffix: pwsh7
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester ${{ env.PESTER_VERSION }}
        shell: pwsh
        run: |
          & '${{ matrix.exe }}' -NoProfile -ExecutionPolicy Bypass `
              -File ./.github/scripts/Install-TestDependency.ps1 `
              -PesterVersion '${{ env.PESTER_VERSION }}'
          if ($LASTEXITCODE -ne 0) { throw "Pester install failed ($LASTEXITCODE)." }

      - name: Run tests
        shell: pwsh
        run: |
          & '${{ matrix.exe }}' -NoProfile -ExecutionPolicy Bypass `
              -File ./.github/scripts/Invoke-TestSuite.ps1 `
              -Suffix '${{ matrix.suffix }}' `
              -LegName '${{ matrix.name }}' `
              -PesterVersion '${{ env.PESTER_VERSION }}'
          if ($LASTEXITCODE -ne 0) { throw "Test run failed ($LASTEXITCODE)." }

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-${{ matrix.suffix }}
          path: testresults-${{ matrix.suffix }}.xml
          if-no-files-found: warn
