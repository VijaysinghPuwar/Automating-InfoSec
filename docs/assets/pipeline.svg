<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="WinSecKit pipeline: Windows event logs flow through detections into an HTML report; the host baseline is tested, applied, and reported the same way.">
  <style>
    .bg{fill:#fcfcfb;stroke:#e4e3df}
    .box{fill:#ffffff;stroke:#c9c8c2;stroke-width:1.5}
    .hl{fill:#eaf2fc;stroke:#2a78d6;stroke-width:1.5}
    .t{font:600 14px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#0b0b0b}
    .s{font:12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#52514e}
    .c{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#1b4f9c}
    .lane{font:600 11px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#8a8984;letter-spacing:.08em}
    .a{stroke:#8a8984;stroke-width:1.5;fill:none;marker-end:url(#arr)}
    .ah{fill:#8a8984}
    @media (prefers-color-scheme: dark){
      .bg{fill:#1a1a19;stroke:#33332f}
      .box{fill:#232321;stroke:#4a4944}
      .hl{fill:#16263b;stroke:#3987e5}
      .t{fill:#ffffff}.s{fill:#c3c2b7}.c{fill:#8fbaf0}
      .lane{fill:#8a8984}
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" class="ah"/>
    </marker>
  </defs>
  <rect class="bg" x="1" y="1" width="878" height="298" rx="12"/>

  <text class="lane" x="24" y="34">DETECT</text>
  <rect class="box" x="24" y="46" width="180" height="76" rx="8"/>
  <text class="t" x="40" y="74">Windows event logs</text>
  <text class="s" x="40" y="94">Security, System,</text>
  <text class="s" x="40" y="110">PowerShell/Operational</text>

  <rect class="box" x="240" y="46" width="190" height="76" rx="8"/>
  <text class="c" x="256" y="74">Get-SecurityEventRecord</text>
  <text class="s" x="256" y="94">Normalizes each event</text>
  <text class="s" x="256" y="110">into one record shape</text>

  <rect class="hl" x="466" y="46" width="190" height="76" rx="8"/>
  <text class="c" x="482" y="74">Test-SecurityDetection</text>
  <text class="s" x="482" y="94">6 rules mapped to</text>
  <text class="s" x="482" y="110">MITRE ATT&amp;CK</text>

  <path class="a" d="M204 84 H236"/>
  <path class="a" d="M430 84 H462"/>

  <text class="lane" x="24" y="166">HARDEN</text>
  <rect class="box" x="24" y="178" width="180" height="76" rx="8"/>
  <text class="t" x="40" y="206">Host configuration</text>
  <text class="s" x="40" y="226">Registry values and</text>
  <text class="s" x="40" y="242">Windows Firewall</text>

  <rect class="box" x="240" y="178" width="190" height="76" rx="8"/>
  <text class="c" x="256" y="206">Test-SecurityBaseline</text>
  <text class="s" x="256" y="226">6 controls, each with</text>
  <text class="s" x="256" y="242">a written rationale</text>

  <rect class="hl" x="466" y="178" width="190" height="76" rx="8"/>
  <text class="c" x="482" y="206">Invoke-SecurityBaseline</text>
  <text class="s" x="482" y="226">Remediates drift;</text>
  <text class="s" x="482" y="242">supports -WhatIf</text>

  <path class="a" d="M204 216 H236"/>
  <path class="a" d="M430 216 H462"/>

  <rect class="box" x="696" y="112" width="160" height="76" rx="8"/>
  <text class="c" x="712" y="140">Export-</text>
  <text class="c" x="712" y="156">SecurityReport</text>
  <text class="s" x="712" y="176">Self-contained HTML</text>

  <path class="a" d="M656 84 C680 84 676 136 692 140"/>
  <path class="a" d="M656 216 C680 216 676 164 692 160"/>
</svg>
